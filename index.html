<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse — Your Daily News Buddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;
      --text:#e8e8f0;--muted:#5a5a7a;--accent:#7c6af7;
      --green:#6af7a0;--red:#f76a6a;--yellow:#f7e06a;--orange:#f7a06a;
      --font-display:'Syne',sans-serif;--font-mono:'JetBrains Mono',monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:var(--font-mono);min-height:100vh;display:flex;align-items:center;justify-content:center}

    /* ── TWO COLUMN LAYOUT ── */
    .layout{display:flex;gap:16px;width:100%;max-width:980px;padding:24px 20px;align-items:flex-start}
    .main-col{width:460px;flex-shrink:0;display:flex;flex-direction:column;gap:20px}
    .sidebar-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;position:sticky;top:24px}

    /* ── HEADER ── */
    .header{display:flex;align-items:center;gap:10px}
    .logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:blink 2.5s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .app-name{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-.5px}
    .app-name span{color:var(--accent)}
    .status-pill{margin-left:auto;font-size:10px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:1px;transition:all .3s}
    .status-pill.listening{border-color:var(--green);color:var(--green)}
    .status-pill.speaking{border-color:var(--accent);color:var(--accent)}

    /* ── SCREENS ── */
    .screen{display:none;flex-direction:column;gap:16px}
    .screen.active{display:flex}
    .big-title{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-1px}
    .big-title span{color:var(--accent)}
    .go-btn{padding:13px;background:var(--accent);border:none;border-radius:99px;color:white;font-family:var(--font-mono);font-size:13px;font-weight:500;cursor:pointer;letter-spacing:.5px;transition:all .2s}
    .go-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,106,247,.3)}
    .go-btn:disabled{opacity:.4;transform:none;cursor:not-allowed}
    .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;align-self:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .load-title{font-family:var(--font-display);font-size:18px;font-weight:700;text-align:center}
    .load-step{font-size:12px;color:var(--muted);text-align:center}
    .load-bar-wrap{width:100%;height:4px;background:var(--border);border-radius:99px;overflow:hidden}
    .load-bar{height:100%;background:var(--accent);border-radius:99px;width:0%;transition:width .5s ease}
    .cat-intro{font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
    .cat-intro span{color:var(--accent)}
    .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .cat-btn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;text-align:left}
    .cat-btn:hover{transform:translateY(-2px);border-color:var(--cat-color,var(--accent));box-shadow:0 6px 20px rgba(0,0,0,.3)}
    .cat-btn.empty{opacity:.4;cursor:not-allowed}
    .cat-emoji{font-size:22px}
    .cat-label{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--cat-color,var(--text))}
    .cat-count{font-size:10px;color:var(--muted)}
    .waveform{display:flex;align-items:center;justify-content:center;gap:4px;height:52px}
    .bar{width:3px;border-radius:99px;background:var(--accent);height:6px;opacity:.2;transition:background .3s}
    .waveform.active .bar{opacity:1;animation:wav .9s infinite ease-in-out}
    .waveform.listening .bar{background:var(--green)}
    .bar:nth-child(1){animation-delay:.00s}.bar:nth-child(2){animation-delay:.10s}.bar:nth-child(3){animation-delay:.20s}.bar:nth-child(4){animation-delay:.30s}.bar:nth-child(5){animation-delay:.40s}.bar:nth-child(6){animation-delay:.30s}.bar:nth-child(7){animation-delay:.20s}.bar:nth-child(8){animation-delay:.10s}.bar:nth-child(9){animation-delay:.00s}
    @keyframes wav{0%,100%{height:6px}50%{height:36px}}
    .conversation{display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:280px;overflow-y:auto;padding:2px 0}
    .conversation::-webkit-scrollbar{width:2px}
    .conversation::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
    .bubble{display:flex;gap:9px;align-items:flex-end;animation:fadeUp .3s ease}
    .bubble.user{flex-direction:row-reverse}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .avatar{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
    .bubble.app .avatar{background:var(--accent)}
    .bubble.user .avatar{background:var(--surface);border:1px solid var(--border)}
    .btext{max-width:82%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.65}
    .bubble.app .btext{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:2px}
    .bubble.user .btext{background:var(--accent);color:white;border-bottom-right-radius:2px}
    .mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
    .mic-btn{width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;font-size:22px;transition:all .2s}
    .mic-btn.off{background:var(--surface);border:2px solid var(--border)}
    .mic-btn.ready{background:var(--accent);animation:rdy 2s infinite}
    .mic-btn.listening{background:var(--green);animation:lstn 1s infinite}
    @keyframes rdy{0%,100%{box-shadow:0 0 0 0 rgba(124,106,247,.35)}50%{box-shadow:0 0 0 14px rgba(124,106,247,0)}}
    @keyframes lstn{0%,100%{box-shadow:0 0 0 0 rgba(106,247,160,.4)}50%{box-shadow:0 0 0 18px rgba(106,247,160,0)}}
    .mic-hint{font-size:11px;color:var(--muted);letter-spacing:.5px}
    .text-row{display:flex;gap:8px}
    .text-in{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-family:var(--font-mono);font-size:13px;outline:none;transition:border-color .2s}
    .text-in:focus{border-color:var(--accent)}
    .text-in::placeholder{color:var(--muted)}
    .send-btn{padding:10px 15px;background:var(--accent);border:none;border-radius:8px;color:white;cursor:pointer;font-size:16px}
    .restart-row{text-align:center}
    .restart-link{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

    /* ── SIDEBAR ── */
    .sidebar{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
    .sidebar-title{padding:12px 14px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
    .sidebar-title strong{color:var(--text);font-size:13px;text-transform:none;letter-spacing:0}

    /* category tabs */
    .sb-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
    .sb-tabs::-webkit-scrollbar{height:0}
    .sb-tab{padding:8px 12px;font-size:11px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font-mono)}
    .sb-tab:hover{color:var(--text)}
    .sb-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .sb-tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--border);margin-right:5px;transition:background .3s}
    .sb-tab.done .dot{background:var(--green)}
    .sb-tab.loading .dot{background:var(--yellow);animation:blink 1s infinite}
    .sb-tab.error .dot{background:var(--red)}

    /* content panels */
    .sb-panels{flex:1;overflow-y:auto;padding:14px}
    .sb-panels::-webkit-scrollbar{width:3px}
    .sb-panels::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
    .sb-panel{display:none}
    .sb-panel.active{display:block}

    /* sections inside a panel */
    .sb-section{margin-bottom:16px}
    .sb-section-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .sb-section-title::after{content:'';flex:1;height:1px;background:var(--border)}

    /* article card */
    .article-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;font-size:11px;line-height:1.7}
    .article-card .art-source{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
    .article-card .art-title{color:var(--text);font-weight:600;margin-bottom:4px;line-height:1.5}
    .article-card .art-desc{color:var(--muted);line-height:1.6}

    /* prompt block */
    .prompt-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:10px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--muted);max-height:160px;overflow-y:auto}
    .prompt-block strong{color:var(--accent);display:block;margin-bottom:4px;font-size:9px;text-transform:uppercase;letter-spacing:1px}
    .prompt-block span{color:var(--text)}

    /* output block */
    .output-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:10px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:#6af7a044;max-height:160px;overflow-y:auto}
    .output-block.has-data{color:var(--green)}

    /* final card */
    .final-card{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px;margin-bottom:8px;font-size:11px}
    .final-card .fc-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
    .final-card .fc-val{color:var(--text);line-height:1.6}

    .sb-placeholder{font-size:11px;color:var(--muted);padding:20px 0;text-align:center}

    /* mobile sidebar toggle */
    .sb-toggle{display:none;position:fixed;bottom:20px;right:20px;width:48px;height:48px;background:var(--accent);border:none;border-radius:50%;color:white;font-size:18px;cursor:pointer;box-shadow:0 4px 20px rgba(124,106,247,.5);z-index:100}

    @media(max-width:780px){
      .layout{flex-direction:column;max-width:460px}
      .sidebar-col{position:fixed;bottom:0;right:0;width:100%;z-index:99;max-height:55vh;display:none}
      .sidebar-col.open{display:flex}
      .sidebar{border-radius:14px 14px 0 0;max-height:55vh}
      .sb-toggle{display:flex;align-items:center;justify-content:center}
      .main-col{width:100%}
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- ── MAIN COLUMN ── -->
  <div class="main-col">
    <div class="header">
      <div class="logo-dot"></div>
      <div class="app-name">Pulse<span>.</span></div>
      <div class="status-pill" id="statusPill">idle</div>
    </div>

    <!-- SCREEN 1: START -->
    <div class="screen active" id="s-start" style="padding:20px 0;align-items:center;text-align:center;gap:20px">
      <div class="big-title">Your news,<br><span>out loud.</span></div>
      <p style="font-size:12px;color:var(--muted);line-height:1.7">
        Fresh AI-summarized news, just for you.<br>
        Tone: <strong style="color:var(--accent)" id="toneLabel"></strong>
      </p>
      <button class="go-btn" onclick="startFetch()">Fetch Today's News →</button>
    </div>

    <!-- SCREEN 2: LOADING -->
    <div class="screen" id="s-load" style="padding:20px 0;align-items:center;gap:14px">
      <div class="spinner"></div>
      <div class="load-title">Fetching your news...</div>
      <div class="load-step" id="loadStep">Starting up...</div>
      <div class="load-bar-wrap" style="width:100%"><div class="load-bar" id="loadBar"></div></div>
    </div>

    <!-- SCREEN 3: CATEGORIES -->
    <div class="screen" id="s-cat">
      <div class="cat-intro">What's your<br><span>vibe today?</span></div>
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <!-- SCREEN 4: CONVERSATION -->
    <div class="screen" id="s-conv">
      <div class="waveform" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="conversation" id="chat"></div>
      <div class="mic-wrap">
        <button class="mic-btn off" id="micBtn" onclick="toggleMic()">🎙️</button>
        <div class="mic-hint" id="micHint">tap to speak</div>
      </div>
      <div class="text-row">
        <input class="text-in" id="textIn" placeholder="or type here..." onkeydown="if(event.key==='Enter')sendText()" />
        <button class="send-btn" onclick="sendText()">↑</button>
      </div>
      <div class="restart-row"><span class="restart-link" onclick="location.reload()">↺ start over</span></div>
    </div>
  </div>

  <!-- ── SIDEBAR COLUMN ── -->
  <div class="sidebar-col" id="sidebarCol">
    <div class="sidebar">
      <div class="sidebar-title">🔍 <strong>Pipeline Inspector</strong> &nbsp;— see exactly what's happening</div>
      <div class="sb-tabs" id="sbTabs"></div>
      <div class="sb-panels" id="sbPanels">
        <div class="sb-placeholder">Run a fetch to see the data pipeline here.</div>
      </div>
    </div>
  </div>

</div>

<!-- Mobile toggle -->
<button class="sb-toggle" id="sbToggle" onclick="toggleSidebar()" title="Toggle Inspector">🔍</button>

<script src="config.js"></script>
<script src="ai.js"></script>
<script>
// ── INIT ──────────────────────────────────────────────────
document.getElementById("toneLabel").textContent = CONFIG.TONE;

// Build sidebar tabs on load
function initSidebar() {
  const tabs   = document.getElementById("sbTabs");
  const panels = document.getElementById("sbPanels");
  tabs.innerHTML = "";
  panels.innerHTML = "";

  CONFIG.CATEGORIES.forEach((cat, i) => {
    // Tab
    const tab = document.createElement("button");
    tab.className  = "sb-tab" + (i === 0 ? " active" : "");
    tab.id         = `tab-${cat.id}`;
    tab.innerHTML  = `<span class="dot"></span>${cat.emoji} ${cat.label}`;
    tab.onclick    = () => switchTab(cat.id);
    tabs.appendChild(tab);

    // Panel
    const panel = document.createElement("div");
    panel.className = "sb-panel" + (i === 0 ? " active" : "");
    panel.id        = `panel-${cat.id}`;
    panel.innerHTML = `<div class="sb-placeholder">Waiting for fetch...</div>`;
    panels.appendChild(panel);
  });
}

function switchTab(catId) {
  document.querySelectorAll(".sb-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".sb-panel").forEach(p => p.classList.remove("active"));
  document.getElementById(`tab-${catId}`)?.classList.add("active");
  document.getElementById(`panel-${catId}`)?.classList.add("active");
}

function toggleSidebar() {
  document.getElementById("sidebarCol").classList.toggle("open");
}

// ── SIDEBAR EVENT LISTENER ────────────────────────────────
window.addEventListener("pulse:sidebar", (e) => {
  const { catId, section, data } = e.detail;
  renderSidebarSection(catId, section, data);

  // Update tab state
  const tab = document.getElementById(`tab-${catId}`);
  if (!tab) return;
  if (section === "status") {
    tab.classList.remove("done","loading","error");
    if (data === "done")          tab.classList.add("done");
    else if (data.includes("fail") || data === "error") tab.classList.add("error");
    else                          tab.classList.add("loading");
  }
  if (section === "error") tab.classList.add("error");
});

function renderSidebarSection(catId, section, data) {
  const panel = document.getElementById(`panel-${catId}`);
  if (!panel) return;

  // Remove placeholder
  const ph = panel.querySelector(".sb-placeholder");
  if (ph) ph.remove();

  // Find or create section div
  let sec = panel.querySelector(`[data-section="${section}"]`);
  if (!sec) {
    sec = document.createElement("div");
    sec.className = "sb-section";
    sec.setAttribute("data-section", section);
    panel.appendChild(sec);
  }

  if (section === "rawNews") {
    sec.innerHTML = `<div class="sb-section-title">📰 Raw News from API</div>` +
      data.map(a => `
        <div class="article-card">
          <div class="art-source">${a.source}</div>
          <div class="art-title">${a.title}</div>
          <div class="art-desc">${a.summary || "(no description)"}</div>
        </div>`).join("");
  }

  else if (section === "groqInput") {
    sec.innerHTML = `<div class="sb-section-title">🤖 Input sent to Groq</div>
      <div class="prompt-block">
        <strong>Model</strong><span>${data.model}  |  tone: ${data.tone}</span>
        <strong>System Prompt</strong><span>${escHtml(data.systemPrompt)}</span>
        <strong>User Prompt</strong><span>${escHtml(data.userPrompt)}</span>
      </div>`;
  }

  else if (section === "groqOutput") {
    sec.innerHTML = `<div class="sb-section-title">💬 Raw Output from Groq</div>
      <div class="output-block has-data">${escHtml(data)}</div>`;
  }

  else if (section === "final") {
    sec.innerHTML = `<div class="sb-section-title">✅ Final Parsed Result</div>` +
      data.map((item, i) => `
        <div class="final-card">
          <div class="fc-label">Story ${i+1} · ${item.source}</div>
          <div class="fc-label" style="margin-top:6px;color:var(--accent)">Headline</div>
          <div class="fc-val">${item.headline}</div>
          <div class="fc-label" style="margin-top:6px">Detail</div>
          <div class="fc-val">${item.detail}</div>
          <div class="fc-label" style="margin-top:6px">Extra</div>
          <div class="fc-val">${item.extra}</div>
        </div>`).join("");
  }

  else if (section === "error") {
    sec.innerHTML = `<div class="sb-section-title" style="color:var(--red)">❌ Error</div>
      <div class="output-block" style="color:var(--red)">${escHtml(String(data))}</div>`;
  }
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── SCREENS ───────────────────────────────────────────────
let newsData = {};

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function setStep(msg, pct) {
  document.getElementById("loadStep").textContent = msg;
  document.getElementById("loadBar").style.width  = pct + "%";
}

// ── MAIN FETCH FLOW ───────────────────────────────────────
async function startFetch() {
  initSidebar();
  show("s-load");
  let anySuccess = false;

  for (let i = 0; i < CONFIG.CATEGORIES.length; i++) {
    const cat = CONFIG.CATEGORIES[i];
    setStep(`${cat.emoji} ${cat.label}...`, Math.round((i / CONFIG.CATEGORIES.length) * 90));
    switchTab(cat.id);   // auto-switch sidebar to active category

    try {
      newsData[cat.id] = await fetchAndSummarize(cat);
      anySuccess = true;
    } catch(e) {
      window.dispatchEvent(new CustomEvent("pulse:sidebar", {
        detail: { catId: cat.id, section: "error", data: e.message }
      }));
      newsData[cat.id] = [];
    }
  }

  setStep("Done! 🎉", 100);
  await new Promise(r => setTimeout(r, 600));

  if (!anySuccess) { setStep("❌ All failed — check sidebar →", 100); return; }

  buildCategoryGrid();
  show("s-cat");
}

// ── CATEGORY GRID ─────────────────────────────────────────
function buildCategoryGrid() {
  const grid = document.getElementById("catGrid");
  grid.innerHTML = "";
  CONFIG.CATEGORIES.forEach(cat => {
    const items = newsData[cat.id] || [];
    const btn   = document.createElement("button");
    btn.className = "cat-btn" + (items.length === 0 ? " empty" : "");
    btn.style.setProperty("--cat-color", cat.color);
    btn.innerHTML = `<span class="cat-emoji">${cat.emoji}</span><span class="cat-label">${cat.label}</span><span class="cat-count">${items.length > 0 ? items.length+" stories" : "unavailable"}</span>`;
    if (items.length > 0) btn.onclick = () => startConversation(cat.id);
    grid.appendChild(btn);
  });
}

// ── STATE MACHINE ─────────────────────────────────────────
const S = { FOLLOWUP:'followup', ANSWERING:'answering', CLOSING:'closing' };
let state = S.FOLLOWUP, currentCat = null, currentNews = null;

function startConversation(catId) {
  currentCat = CONFIG.CATEGORIES.find(c => c.id === catId);
  show("s-conv");
  setTimeout(deliver, 400);
}
function deliver() {
  const items = newsData[currentCat.id];
  currentNews = items[Math.floor(Math.random() * items.length)];
  appSays(`Here's your ${currentCat.label} update —`, () => {
    setTimeout(() => {
      appSays(currentNews.headline, () => {
        state = S.FOLLOWUP;
        setTimeout(() => appSays("Want to know more?", () => micState('ready')), 600);
      });
    }, 300);
  });
}
function route(i) {
  if (state === S.FOLLOWUP) {
    if (i === 'no') { closeConv(); return; }
    appSays(currentNews.detail || "That's all I have!", () => {
      state = S.ANSWERING;
      setTimeout(() => appSays("Anything else?", () => micState('ready')), 600);
    });
  } else if (state === S.ANSWERING) {
    if (i === 'no') { closeConv(); return; }
    appSays(currentNews.extra || "That's everything!", () => setTimeout(closeConv, 400));
  } else {
    appSays("Hit ↺ start over to go again!");
  }
}
function closeConv() { state = S.CLOSING; appSays(`That's all for ${currentCat.label} today! 👋`); }
function intent(t)   { t=t.toLowerCase(); return /\b(no|nah|nope|skip|done|bye|thanks|stop)\b/.test(t)?'no':'yes'; }

// ── TTS ───────────────────────────────────────────────────
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() { voices = synth.getVoices(); }
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

function speak(text, onEnd) {
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 1.0; utt.pitch = 1.05; utt.volume = 1.0;
  const pick = voices.find(v => v.lang.startsWith('en') && /female|zira|samantha|karen|google/i.test(v.name))
            || voices.find(v => v.lang.startsWith('en-'))
            || voices[0];
  if (pick) utt.voice = pick;
  setStatus('speaking'); wave('active');
  utt.onend   = () => { setStatus('idle'); wave('off'); if (onEnd) onEnd(); };
  utt.onerror = ()  => { setStatus('idle'); wave('off'); if (onEnd) onEnd(); };
  synth.speak(utt);
}

// ── STT ───────────────────────────────────────────────────
let recog = null, listening = false;
function buildRecog() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.continuous = false; r.interimResults = false; r.lang = 'en-US';
  r.onresult = e => handleInput(e.results[0][0].transcript);
  r.onend    = () => { listening=false; micState('ready'); setStatus('idle'); wave('off'); };
  r.onerror  = () => { listening=false; micState('ready'); };
  return r;
}
function startListen() { recog=buildRecog(); if(!recog){document.getElementById('textIn').focus();return} recog.start(); listening=true; micState('listening'); setStatus('listening'); wave('listening'); }
function stopListen()  { if(recog)recog.stop(); listening=false; micState('ready'); }
function toggleMic()   { listening?stopListen():startListen(); }

// ── UI HELPERS ────────────────────────────────────────────
function setStatus(s)    { const el=document.getElementById('statusPill'); el.textContent=s; el.className='status-pill'+(s!=='idle'?' '+s:''); }
function wave(mode)      { const wf=document.getElementById('waveform'); wf.className='waveform'+(mode!=='off'?' active':'')+(mode==='listening'?' listening':''); }
function micState(s)     { document.getElementById('micBtn').className='mic-btn '+s; document.getElementById('micHint').textContent=s==='listening'?'listening...':'tap to speak'; }
function bubble(who,txt) { const c=document.getElementById('chat'),d=document.createElement('div'); d.className='bubble '+who; d.innerHTML=`<div class="avatar">${who==='app'?'🎙':'👤'}</div><div class="btext">${txt}</div>`; c.appendChild(d); c.scrollTop=c.scrollHeight; }
function appSays(t,fn)   { bubble('app',t); speak(t,fn); }
function handleInput(t)  { if(!t.trim())return; bubble('user',t); route(intent(t)); }
function sendText()      { const el=document.getElementById('textIn'),v=el.value.trim(); if(!v)return; el.value=''; handleInput(v); }
</script>
